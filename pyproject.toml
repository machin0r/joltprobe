[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocppscan"
version = "0.1.0"
description = "OCPP Security Assessment Tool"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
frontend = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
ocppscan     = "ocppscan.cli:cli"
ocppscan-web = "frontend.app:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["ocppscan*", "frontend*"]

[tool.setuptools.package-data]
ocppscan = ["payloads/**/*", "injection/payloads/**/*"]
